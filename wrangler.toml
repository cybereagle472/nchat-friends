# Cloudflare Worker config for the NChat *frontend* (static site hosting).
# This is a separate deployment from worker/wrangler.toml (the API backend).
# Build command (set in the Cloudflare dashboard) must run first: npm run build
# which produces ./dist — this config then just serves those static files,
# falling back to index.html for client-side routes.

name = "nchat-friends-deploy"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
