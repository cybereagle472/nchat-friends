name = "nchat-friends"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 database (replaces Supabase Postgres) ──
# Create with: wrangler d1 create nchat-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nchat-db"
database_id = "6dc0888d-645c-470c-8f27-fa8d5a21ba80"

# ── R2 bucket (replaces Supabase Storage) ──
# Create with: wrangler r2 bucket create nchat-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nchat-media"

# ── Durable Object for realtime (replaces Supabase Realtime) ──
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

[vars]
# Public base URL this Worker is deployed at (used to build media URLs).
# Set the real one after your first `wrangler deploy`.
PUBLIC_API_URL = "https://nchat-friends.usa66486.workers.dev"

# ── Secrets (set these, never commit them) ──
# wrangler secret put JWT_SECRET
# wrangler secret put VAPID_PUBLIC_KEY
# wrangler secret put VAPID_PRIVATE_KEY
#
# ── Cloudflare Realtime TURN (optional, strongly recommended for calls) ──
# Without this, calls fall back to a free/unreliable public TURN relay and
# will often fail to connect when both people are on different networks.
# 1. Open https://dash.cloudflare.com/?to=/:account/calls and create a TURN
#    App — this gives you a Key ID and an API Token (not the same as your
#    Cloudflare account API token).
# 2. wrangler secret put CF_TURN_KEY_ID
# 3. wrangler secret put CF_TURN_KEY_API_TOKEN
# Pricing: $0.05/GB egressed through the relay, with the first 1,000 GB
# (1 TB) free every month — https://developers.cloudflare.com/realtime/sfu/platform/pricing/
